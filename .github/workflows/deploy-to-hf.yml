# GitHub Actions workflow to deploy the STT-trails app to Hugging Face Spaces
# This workflow will build the app and push it to Hugging Face using the huggingface-cli

name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Hugging Face Hub CLI
        run: pip install huggingface_hub

      - name: Login to Hugging Face CLI
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          huggingface-cli login --token $HF_TOKEN

      - name: Push to Hugging Face Space via git
        env:
          HF_SPACE_GIT_TOKEN: ${{ secrets.HF_SPACE_GIT_TOKEN }}
        run: |
          # Set up git config
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          # Clone the Hugging Face Space repo using the token
          git clone https://huggingface.co/spaces/<your-username>/<your-space-repo> hf-space-repo

          # Copy all files (except .git) to the repo
          rsync -av --exclude='.git' ./ hf-space-repo/

          cd hf-space-repo
          git add .
          git commit -m "Update Space from GitHub Actions" || echo "No changes to commit"
          git push https://huggingface.co/${HF_SPACE_GIT_TOKEN}@huggingface.co/spaces/<your-username>/<your-space-repo>.git main

          cd ..
