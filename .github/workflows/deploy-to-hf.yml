# GitHub Actions workflow to deploy the STT-trails app to Hugging Face Spaces
# This workflow will build the app and push it to Hugging Face using the huggingface-cli

name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Hugging Face Hub CLI
        run: pip install huggingface_hub

      - name: Login to Hugging Face CLI
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          huggingface-cli login --token $HF_TOKEN

      - name: Push to Hugging Face Space via git
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        run: |
          # Set up git config
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          # Clone the Hugging Face Space repo using the token
          git clone https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME.git hf-space
          
          # Copy all files to HF space
          cp -r * hf-space/ || true
          
          # Push to Hugging Face
          cd hf-space
          git add .
          git commit -m "Deploy from bot_text branch - $(date)" || echo "No changes to commit"
          git push https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME.git main
      - name: Deployment Complete
        run: echo "Deployment to Hugging Face Spaces completed successfully."